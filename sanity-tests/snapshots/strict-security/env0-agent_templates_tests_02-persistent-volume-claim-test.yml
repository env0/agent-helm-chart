---
# Source: env0-agent/templates/tests/02-persistent-volume-claim-test.yml
apiVersion: v1
kind: Pod
metadata:
  name: &name "agent-persistent-volume-claim-test"
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  
  
  volumes:
    - name: env0-state-volume
      persistentVolumeClaim:
        claimName: env0-state-volume-claim
  containers:
    - name: *name
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
            type: RuntimeDefault
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      image: ghcr.io/env0/deployment-agent:dev
      imagePullPolicy: Always
      volumeMounts:
        - name: env0-state-volume
          mountPath: /mnt/public/
        - name: env0-state-volume
          mountPath: "/mnt/shared"
      command:
        - /bin/bash
        - -ec
        - |
          # Deployments write their state here as the job's user, so a mounted but read-only volume still breaks them
          probe="/mnt/public//.helm-test-$HOSTNAME"
          if touch "$probe" && rm "$probe"; then
            echo "✅💾 Persistent volume claim is writable at /mnt/public/"
          else
            echo "❌ Persistent volume claim at /mnt/public/ is not writable by uid $(id -u)"
            exit 1
          fi
