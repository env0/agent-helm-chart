---
# Source: env0-agent/templates/tests/02-persistent-volume-claim-test.yml
apiVersion: v1
kind: Pod
metadata:
  name: &name "agent-persistent-volume-claim-test"
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  
  imagePullSecrets:
    - name: my-registry-secret
  
  
  volumes:
    - name: env0-state-volume
      persistentVolumeClaim:
        claimName: env0-state-volume-claim
  containers:
    - name: *name
      image: ghcr.io/env0/deployment-agent:dev
      imagePullPolicy: Always
      volumeMounts:
        - name: env0-state-volume
          mountPath: /mnt/private/env0
        - name: env0-state-volume
          mountPath: "/mnt/shared"
      command:
        - /bin/bash
        - -ec
        - |
          # Deployments write their state here as the job's user, so a mounted but read-only volume still breaks them
          probe="/mnt/private/env0/.helm-test-$HOSTNAME"
          if touch "$probe" && rm "$probe"; then
            echo "✅💾 Persistent volume claim is writable at /mnt/private/env0"
          else
            echo "❌ Persistent volume claim at /mnt/private/env0 is not writable by uid $(id -u)"
            exit 1
          fi
