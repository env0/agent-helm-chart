{{- define "env0-agent.persistent-volume-claim-test.commands" -}}
# Deployments write their state here as the job's user, so a mounted but read-only volume still breaks them
probe="{{ include "env0-agent.stateMountPath" . }}/.helm-test-$HOSTNAME"
if touch "$probe" && rm "$probe"; then
  echo "✅💾 Persistent volume claim is writable at {{ include "env0-agent.stateMountPath" . }}"
else
  echo "❌ Persistent volume claim at {{ include "env0-agent.stateMountPath" . }} is not writable by uid $(id -u)"
  exit 1
fi
{{- end -}}

{{- if eq (include "env0-agent.shouldUsePVC" .) "true" }}
{{- include "env0-agent.test" (dict "root" . "testName" "persistent-volume-claim" "commands" "env0-agent.persistent-volume-claim-test.commands" "persistentVolumeClaim" true) -}}
{{- else }}
{{- /* This is a no-op test when PVC is not enabled */ -}}
{{- printf "---\n# Skipping PVC test as shouldUsePVC is false" | nindent 0 }}
{{- end -}}
